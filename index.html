<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarod M. Berg Photography — San Luis Obispo, CA</title>
  <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow-x: hidden; }
    button, input, textarea, select { font-family: inherit; }
    input::placeholder, textarea::placeholder { opacity: 0.45; }
    a { color: inherit; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ── THEMES ────────────────────────────────────────────────────────────────────
const THEMES = {
  'Bright Minimal': {
    bg:'#fafaf8', bgAlt:'#f2f0ec', fg:'#111110', fgMuted:'#6e6e6a',
    accent:'oklch(34% 0.09 255)', accentFg:'#ffffff',
    border:'#e0ddd8', navBg:'rgba(250,250,248,0.93)',
    heroOverlay:'rgba(10,10,8,0.35)',
    hf:'"Cormorant Garamond",Georgia,serif', bf:'"DM Sans",system-ui,sans-serif',
  },
  'Dark Cinematic': {
    bg:'#0d0c0b', bgAlt:'#181715', fg:'#eeebe4', fgMuted:'#888480',
    accent:'oklch(72% 0.10 48)', accentFg:'#0d0c0b',
    border:'#2c2a27', navBg:'rgba(13,12,11,0.93)',
    heroOverlay:'rgba(0,0,0,0.55)',
    hf:'"Cormorant Garamond",Georgia,serif', bf:'"DM Sans",system-ui,sans-serif',
  },
  'Warm Editorial': {
    bg:'#f5efe6', bgAlt:'#ece5da', fg:'#24201a', fgMuted:'#7c7066',
    accent:'oklch(40% 0.10 28)', accentFg:'#f5efe6',
    border:'#d5cdc2', navBg:'rgba(245,239,230,0.93)',
    heroOverlay:'rgba(20,14,8,0.40)',
    hf:'"Cormorant Garamond",Georgia,serif', bf:'"DM Sans",system-ui,sans-serif',
  },
};

// ── PLACEHOLDER ───────────────────────────────────────────────────────────────
const Img = ({ label='photo', aspect='3/2', style={}, dark=false }) => {
  const c1 = dark ? '#1e1e1c' : '#d8d4ce', c2 = dark ? '#252523' : '#e8e4de';
  return (
    <div style={{ aspectRatio:aspect, background:`repeating-linear-gradient(45deg,${c1} 0,${c1} 1px,${c2} 0,${c2} 50%)`, backgroundSize:'10px 10px', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'monospace', fontSize:10, letterSpacing:'0.06em', color:dark?'#555':'#aaa', textTransform:'uppercase', width:'100%', flexShrink:0, ...style }}>
      {label}
    </div>
  );
};

// ── WORDMARK ──────────────────────────────────────────────────────────────────
const Wordmark = ({ t, variant='stacked', onClick }) => {
  if (variant === 'mono') return (
    <div onClick={onClick} style={{ cursor:'pointer', display:'flex', alignItems:'center', gap:10, whiteSpace:'nowrap' }}>
      <div style={{ width:34, height:34, border:`1.5px solid ${t.fg}`, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:t.hf, fontSize:17, color:t.fg, flexShrink:0 }}>JB</div>
      <div>
        <div style={{ fontFamily:t.bf, fontSize:11, letterSpacing:'0.22em', textTransform:'uppercase', color:t.fg, lineHeight:1 }}>JAROD M. BERG</div>
        <div style={{ fontFamily:t.bf, fontSize:9, letterSpacing:'0.18em', textTransform:'uppercase', color:t.fgMuted, marginTop:3 }}>PHOTOGRAPHY</div>
      </div>
    </div>
  );
  if (variant === 'serif') return (
    <div onClick={onClick} style={{ cursor:'pointer', whiteSpace:'nowrap' }}>
      <div style={{ fontFamily:t.hf, fontSize:19, fontStyle:'italic', color:t.fg, lineHeight:1 }}>Jarod M. Berg</div>
      <div style={{ fontFamily:t.bf, fontSize:9, letterSpacing:'0.22em', textTransform:'uppercase', color:t.fgMuted, marginTop:3 }}>PHOTOGRAPHY</div>
    </div>
  );
  return (
    <div onClick={onClick} style={{ cursor:'pointer', whiteSpace:'nowrap' }}>
      <div style={{ fontFamily:t.bf, fontWeight:600, fontSize:13, letterSpacing:'0.28em', textTransform:'uppercase', color:t.fg, lineHeight:1 }}>JAROD M. BERG</div>
      <div style={{ fontFamily:t.bf, fontSize:8.5, letterSpacing:'0.24em', textTransform:'uppercase', color:t.fgMuted, marginTop:3 }}>PHOTOGRAPHY</div>
    </div>
  );
};

// ── NAV ───────────────────────────────────────────────────────────────────────
const Nav = ({ t, page, setPage, wmark }) => {
  const links = ['Portfolio','About','Services','Blog','Contact'];
  return (
    <nav style={{ position:'fixed', top:0, left:0, right:0, zIndex:100, background:t.navBg, backdropFilter:'blur(12px)', borderBottom:`1px solid ${t.border}`, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 48px', height:64 }}>
      <Wordmark t={t} variant={wmark} onClick={() => setPage('home')} />
      <div style={{ display:'flex', alignItems:'center', gap:28 }}>
        {links.map(l => (
          <button key={l} onClick={() => setPage(l.toLowerCase())} style={{ background:'none', border:'none', cursor:'pointer', fontFamily:t.bf, fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', color:page===l.toLowerCase()?t.accent:t.fgMuted, padding:0, transition:'color 0.2s' }}>{l}</button>
        ))}
        <button onClick={() => setPage('book')} style={{ background:t.accent, color:t.accentFg, border:'none', cursor:'pointer', fontFamily:t.bf, fontSize:10, letterSpacing:'0.16em', textTransform:'uppercase', padding:'10px 20px' }}>Book a Session</button>
      </div>
    </nav>
  );
};

// ── FOOTER ────────────────────────────────────────────────────────────────────
const Footer = ({ t, setPage, wmark }) => (
  <footer style={{ background:t.bgAlt, borderTop:`1px solid ${t.border}`, padding:'60px 80px 40px' }}>
    <div style={{ display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:40, marginBottom:48 }}>
      <div>
        <Wordmark t={t} variant={wmark} />
        <p style={{ fontFamily:t.bf, fontSize:13, color:t.fgMuted, marginTop:16, maxWidth:260, lineHeight:1.7 }}>Photographer · Lawyer · Advocate · Creative · Friend of Gaia. Based in San Luis Obispo, CA. Available throughout California and beyond.</p>
        <p style={{ fontFamily:t.bf, fontSize:12, color:t.fgMuted, marginTop:12 }}>hello@jarodberg.com</p>
      </div>
      <div style={{ display:'flex', gap:60, flexWrap:'wrap' }}>
        {[{title:'Work', links:['Portfolio','Services','Client Galleries']},{title:'Info', links:['About','Blog','Contact']}].map(col => (
          <div key={col.title}>
            <div style={{ fontFamily:t.bf, fontSize:10, letterSpacing:'0.2em', textTransform:'uppercase', color:t.fgMuted, marginBottom:14 }}>{col.title}</div>
            {col.links.map(l => (
              <div key={l} style={{ marginBottom:10 }}>
                <button onClick={() => setPage(l.toLowerCase().replace(' ','-'))} style={{ background:'none', border:'none', cursor:'pointer', fontFamily:t.bf, fontSize:13, color:t.fg, padding:0 }}>{l}</button>
              </div>
            ))}
          </div>
        ))}
        <div>
          <div style={{ fontFamily:t.bf, fontSize:10, letterSpacing:'0.2em', textTransform:'uppercase', color:t.fgMuted, marginBottom:14 }}>Follow</div>
          {['Instagram','Facebook','LinkedIn'].map(s => (
            <div key={s} style={{ marginBottom:10 }}>
              <a href="#" style={{ fontFamily:t.bf, fontSize:13, color:t.fg, textDecoration:'none' }}>{s}</a>
            </div>
          ))}
        </div>
      </div>
    </div>
    <div style={{ borderTop:`1px solid ${t.border}`, paddingTop:24, display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:12 }}>
      <span style={{ fontFamily:t.bf, fontSize:11, color:t.fgMuted }}>© 2026 Jarod M. Berg Photography · San Luis Obispo, CA</span>
      <button onClick={() => setPage('privacy')} style={{ background:'none', border:'none', cursor:'pointer', fontFamily:t.bf, fontSize:11, color:t.fgMuted, padding:0 }}>Privacy Policy</button>
    </div>
  </footer>
);

// ── SHARED ────────────────────────────────────────────────────────────────────
const SH = ({ label, title, t, center=false }) => (
  <div style={{ textAlign:center?'center':'left', marginBottom:48 }}>
    {label && <div style={{ fontFamily:t.bf, fontSize:10, letterSpacing:'0.22em', textTransform:'uppercase', color:t.fgMuted, marginBottom:12 }}>{label}</div>}
    <h2 style={{ fontFamily:t.hf, fontSize:44, fontWeight:400, color:t.fg, margin:0, lineHeight:1.1 }}>{title}</h2>
  </div>
);

const Btn = ({ t, onClick, children, outline=false, full=false, type='button' }) => (
  <button type={type} onClick={onClick} style={{ background:outline?'none':t.accent, color:outline?t.fg:t.accentFg, border:outline?`1px solid ${t.border}`:'none', cursor:'pointer', fontFamily:t.bf, fontSize:11, letterSpacing:'0.16em', textTransform:'uppercase', padding:'13px 26px', width:full?'100%':'auto', transition:'opacity 0.2s' }}>
    {children}
  </button>
);

// ══════════════════════════ PAGES ═════════════════════════════════════════════

// ── HOME ──────────────────────────────────────────────────────────────────────
const HomePage = ({ t, setPage }) => {
  const dark = t.bg === '#0d0c0b';
  const specs = [
    { slug:'wedding', label:'Wedding & Events', desc:'From Greengate Ranch to Holman Ranch, I cover Central Coast weddings with unhurried attention and a documentary eye.' },
    { slug:'portrait', label:'Portrait & Headshot', desc:'Executive portraits, personal branding, and headshots that actually look like you — shot on location or in studio.' },
    { slug:'commercial', label:'Commercial & Brand', desc:'Food and wine, hospitality, product, and lifestyle campaigns for Central Coast businesses and brands.' },
    { slug:'landscape', label:'Fine Art & Landscape', desc:'Limited-edition prints of Big Sur, Morro Rock, the Carrizo Plain, and the vineyards of Paso Robles.' },
  ];
  return (
    <div>
      {/* Hero */}
      <div style={{ position:'relative', height:'100vh', overflow:'hidden' }}>
        <Img label="hero — Central Coast landscape or wedding editorial" aspect="auto" style={{ position:'absolute', inset:0, height:'100%', aspectRatio:'auto' }} dark={dark} />
        <div style={{ position:'absolute', inset:0, background:t.heroOverlay }} />
        <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', justifyContent:'flex-end', padding:'0 80px 80px' }}>
          <div style={{ maxWidth:700 }}>
            <div style={{ fontFamily:t.bf, fontSize:11, letterSpacing:'0.22em', textTransform:'uppercase', color:'rgba(255,255,255,0.7)', marginBottom:20 }}>San Luis Obispo, CA · California Central Coast</div>
            <h1 style={{ fontFamily:t.hf, fontSize:76, fontWeight:400, fontStyle:'italic', color:'#fff', margin:'0 0 28px', lineHeight:1.03, textWrap:'pretty' }}>
              Photographs that hold the weight of a moment.
            </h1>
            <div style={{ display:'flex', gap:14 }}>
              <button onClick={() => setPage('portfolio')} style={{ background:'#fff', color:'#111', border:'none', cursor:'pointer', fontFamily:t.bf, fontSize:11, letterSpacing:'0.18em', textTransform:'uppercase', padding:'14px 28px' }}>View Work</button>
              <button onClick={() => setPage('book')} style={{ background:'transparent', color:'#fff', border:'1px solid rgba(255,255,255,0.5)', cursor:'pointer', fontFamily:t.bf, fontSize:11, letterSpacing:'0.18em', textTransform:'uppercase', padding:'14px 28px' }}>Book a Session</button>
            </div>
          </div>
        </div>
      </div>

      {/* Specialties */}
      <div style={{ padding:'100px 80px', background:t.bg }}>
        <SH label="Work" title="Every frame a story." t={t} />
        <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:2 }}>
          {specs.map(s => (
            <div key={s.slug} onClick={() => setPage('portfolio')} style={{ cursor:'pointer' }}>
              <Img label={`${s.slug} — Central Coast`} aspect="3/4" dark={dark} />
              <div style={{ paddingTop:18 }}>
                <div style={{ fontFamily:t.hf, fontSize:22, fontStyle:'italic', color:t.fg, marginBottom:8 }}>{s.label}</div>
                <div style={{ fontFamily:t.bf, fontSize:12, color:t.fgMuted, lineHeight:1.7 }}>{s.desc}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* About teaser */}
      <div style={{ background:t.bgAlt, padding:'100px 80px', display:'grid', gridTemplateColumns:'1fr 1fr', gap:80, alignItems:'center' }}>
        <Img label="portrait of jarod berg — SLO" aspect="4/5" dark={dark} />
        <div>
          <div style={{ fontFamily:t.bf, fontSize:10, letterSpacing:'0.22em', textTransform:'uppercase', color:t.fgMuted, marginBottom:16 }}>About</div>
          <h2 style={{ fontFamily:t.hf, fontSize:46, fontStyle:'italic', fontWeight:400, color:t.fg, margin:'0 0 22px', lineHeight:1.1 }}>Raised on the Central Coast. Obsessed with its light.</h2>
          <p style={{ fontFamily:t.bf, fontSize:14, color:t.fgMuted, lineHeight:1.85, marginBottom:32 }}>I grew up along the California Central Coast and never left — not because I had to stay, but because the light here does something I have not found anywhere else. From the fog lifting off Morro Bay at dawn to the last gold hour over the Paso vineyards, I have built my practice around the place I know best.</p>
          <Btn t={t} onClick={() => setPage('about')} outline>More About Me</Btn>
        </div>
      </div>

      {/* Press / as-seen strip */}
      <div style={{ background:t.bg, padding:'60px 80px', borderTop:`1px solid ${t.border}`, borderBottom:`1px solid ${t.border}` }}>
        <div style={{ fontFamily:t.bf, fontSize:10, letterSpacing:'0.2em', textTransform:'uppercase', color:t.fgMuted, textAlign:'center', marginBottom:28 }}>As featured in</div>
        <div style={{ display:'flex', gap:56, justifyContent:'center', alignItems:'center', flexWrap:'wrap' }}>
          {['New Times SLO','805 Living','The Tribune','California Wedding Day','Rangefinder Magazine'].map(p => (
            <span key={p} style={{ fontFamily:t.hf, fontSize:18, fontStyle:'italic', color:t.fgMuted, letterSpacing:'0.02em' }}>{p}</span>
          ))}
        </div>
      </div>

      {/* CTA */}
      <div style={{ background:t.bg, padding:'100px 80px', textAlign:'center' }}>
        <div style={{ fontFamily:t.bf, fontSize:10, letterSpacing:'0.22em', textTransform:'uppercase', color:t.fgMuted, marginBottom:20 }}>Book for 2026 — limited dates remain</div>
        <h2 style={{ fontFamily:t.hf, fontSize:56, fontStyle:'italic', fontWeight:400, color:t.fg, margin:'0 0 36px', lineHeight:1.1 }}>Your next great photograph<br />starts with a conversation.</h2>
        <div style={{ display:'flex', gap:14, justifyContent:'center' }}>
          <Btn t={t} onClick={() => setPage('book')}>Book a Free Consult</Btn>
          <Btn t={t} onClick={() => setPage('contact')} outline>Send a Message</Btn>
        </div>
        <div style={{ fontFamily:t.bf, fontSize:11, color:t.fgMuted, marginTop:18 }}>Free · 15 minutes · No commitment</div>
      </div>
    </div>
  );
};

// ── PORTFOLIO ─────────────────────────────────────────────────────────────────
const PortfolioPage = ({ t }) => {
  const dark = t.bg === '#0d0c0b';
  const cats = ['All','Wedding','Portrait','Landscape','Street','Commercial','Sports'];
  const [active, setActive] = React.useState('All');
  const photos = [
    {cat:'Wedding',a:'3/2',l:'greengate ranch ceremony'},{cat:'Portrait',a:'2/3',l:'executive headshot — SLO'},{cat:'Landscape',a:'16/9',l:'morro rock at dawn'},
    {cat:'Wedding',a:'2/3',l:'holman ranch reception'},{cat:'Commercial',a:'3/2',l:'tablas creek vineyard'},{cat:'Street',a:'2/3',l:'downtown SLO'},
    {cat:'Portrait',a:'3/2',l:'personal branding session'},{cat:'Sports',a:'3/2',l:'triathlon — avila beach'},{cat:'Landscape',a:'2/3',l:'big sur coastline'},
    {cat:'Wedding',a:'3/2',l:'sunstone winery — Santa Ynez'},{cat:'Street',a:'2/3',l:'SLO farmers market'},{cat:'Commercial',a:'3/4',l:'edna valley winery'},
    {cat:'Portrait',a:'2/3',l:'musician portrait — SLO'},{cat:'Sports',a:'3/2',l:'cycling — los osos valley rd'},{cat:'Landscape',a:'16/9',l:'carrizo plain superbloom'},
    {cat:'Wedding',a:'3/4',l:'first look — see canyon'},{cat:'Street',a:'3/2',l:'mission plaza golden hour'},{cat:'Commercial',a:'2/3',l:'product — central coast olive oil'},
  ];
  const visible = active === 'All' ? photos : photos.filter(p => p.cat === active);
  return (
    <div style={{ paddingTop:64, background:t.bg, minHeight:'100vh' }}>
      <div style={{ padding:'60px 80px 80px' }}>
        <SH label="Selected Work" title="Portfolio" t={t} />
        <div style={{ display:'flex', gap:8, marginBottom:40, flexWrap:'wrap' }}>
          {cats.map(c => (
            <button key={c} onClick={() => setActive(c)} style={{ background:active===c?t.fg:'none', color:active===c?t.bg:t.fgMuted, border:`1px solid ${active===c?t.fg:t.border}`, cursor:'pointer', fontFamily:t.bf, fontSize:10, letterSpacing:'0.14em', textTransform:'uppercase', padding:'8px 18px', transition:'all 0.18s' }}>{c}</button>
          ))}
        </div>
        <div style={{ columns:'3 300px', gap:4 }}>
          {visible.map((p,i) => (
            <div key={`${active}-${i}`} style={{ breakInside:'avoid', marginBottom:4 }}>
              <Img label={p.l} aspect={p.a} dark={dark} />
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ── ABOUT ─────────────────────────────────────────────────────────────────────
const AboutPage = ({ t, setPage }) => {
  const dark = t.bg === '#0d0c0b';
  const paras = [
    "I am a photographer based in San Luis Obispo, California. My practice spans weddings, editorial portraits, commercial assignments for Central Coast food and wine brands, and personal fine art landscape work. I have been shooting professionally for over a decade.",
    "I grew up on the Central Coast and have watched the light here my entire life — the marine layer that softens a June morning at Morro Bay, the hard afternoon shadows in downtown SLO, the way the last hour of sun turns the vineyards above Paso Robles into something close to gold. That familiarity is what I bring to every shoot: I know exactly where to be and when.",
    "My approach is documentary at its core. Whether I am covering a wedding at Greengate Ranch or a commercial campaign for a local winery, I try to photograph the thing that is actually happening rather than the version of it that was planned. The best frame is usually the one nobody saw coming.",
    "I shoot on both Sony digital and Hasselblad medium format film, depending on what the work calls for. Fine art landscape prints and much of my personal portrait work are shot on film. Commercial and fast-turnaround work is digital.",
    "I believe in a calm, unhurried presence on the day. My clients regularly tell me they forgot I was there — which, for a photographer, is about the highest compliment there is.",
  ];
  return (
    <div style={{ paddingTop:64, background:t.bg, minHeight:'100vh' }}>
      <div style={{ padding:'80px 80px 100px', maxWidth:1200, margin:'0 auto' }}>
        <div style={{ display:'grid', gridTemplateColumns:'5fr 4fr', gap:80, alignItems:'start' }}>
          <div>
            <div style={{ fontFamily:t.bf, fontSize:10, letterSpacing:'0.22em', textTransform:'uppercase', color:t.fgMuted, marginBottom:20 }}>About</div>
            <h1 style={{ fontFamily:t.hf, fontSize:60, fontStyle:'italic', fontWeight:400, color:t.fg, margin:'0 0 16px', lineHeight:1.05 }}>Jarod M. Berg</h1>
            <div style={{ fontFamily:t.bf, fontSize:12, letterSpacing:'0.10em', color:t.fgMuted, marginBottom:36, lineHeight:1.8 }}>Photographer &nbsp;·&nbsp; Lawyer &nbsp;·&nbsp; Advocate &nbsp;·&nbsp; Creative &nbsp;·&nbsp; Friend of Gaia</div>
            {paras.map((p,i) => (
              <p key={i} style={{ fontFamily:t.bf, fontSize:14, color:t.fgMuted, lineHeight:1.9, marginBottom:24 }}>{p}</p>
            ))}
            <div style={{ display:'flex', gap:48, marginTop:52, paddingTop:48, borderTop:`1px solid ${t.border}`, flexWrap:'wrap' }}>
              {[['10+','Years professional'],['300+','Weddings covered'],['California','Home base'],['Worldwide','Available']].map(([n,l]) => (
                <div key={l}>
                  <div style={{ fontFamily:t.hf, fontSize:36, fontWeight:400, color:t.fg }}>{n}</div>
                  <div style={{ fontFamily:t.bf, fontSize:11, color:t.fgMuted, letterSpacing:'0.08em', marginTop:4 }}>{l}</div>
                </div>
              ))}
            </div>
            <div style={{ display:'flex', gap:12, marginTop:40, flexWrap:'wrap' }}>
              <Btn t={t} onClick={() => setPage('book')}>Book a Free Consult</Btn>
              <Btn t={t} onClick={() => setPage('portfolio')} outline>View Portfolio</Btn>
            </div>
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:4, position:'sticky', top:80 }}>
            <Img label="portrait — jarod berg, SLO" aspect="4/5" dark={dark} />
            <Img label="at work — wedding coverage" aspect="16/9" dark={dark} />
          </div>
        </div>

        {/* Gear */}
        <div style={{ marginTop:100, paddingTop:60, borderTop:`1px solid ${t.border}` }}>
          <SH label="Equipment" title="What I shoot with." t={t} />
          <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:2 }}>
            {[
              { cat:'Digital', items:['Sony A7R V (primary)','Sony A7 IV (backup/video)','Sony 24-70mm f/2.8 GM II','Sony 85mm f/1.4 GM','Sony 135mm f/1.8 GM','Sony 16-35mm f/2.8 GM'] },
              { cat:'Film', items:['Hasselblad 500CM','Kodak Portra 400 & 800','Ilford HP5 Plus (B&W)','Mamiya RZ67 (studio)','Nikon FM2 (street carry)','Fujifilm Neopan 100 Acros'] },
              { cat:'Support', items:['Profoto B10 Plus (portable strobe)','Westcott Rapid Box octa','DJI Mavic 3 Pro (aerial)','Manfrotto 055 carbon tripod','Think Tank Airport roller','Capture One Pro 23'] },
            ].map(g => (
              <div key={g.cat} style={{ background:t.bgAlt, padding:'36px 40px', borderTop:`2px solid ${t.fg}` }}>
                <div style={{ fontFamily:t.hf, fontSize:26, fontStyle:'italic', color:t.fg, marginBottom:20 }}>{g.cat}</div>
                {g.items.map(item => (
                  <div key={item} style={{ display:'flex', gap:10, alignItems:'baseline', marginBottom:10 }}>
                    <span style={{ color:t.fgMuted, fontSize:10, flexShrink:0 }}>—</span>
                    <span style={{ fontFamily:t.bf, fontSize:13, color:t.fgMuted }}>{item}</span>
                  </div>
                ))}
              </div>
            ))}
          </div>

const POSTS = [

    title:"Shooting a sunset wedding at Greengate Ranch",
    date:"April 2, 2026", tag:"Wedding",
    excerpt:"The late afternoon light at Greengate Ranch is some of the best I have ever worked with. Here is how I approach the golden hour at one of San Luis Obispo County's most-booked venues.",
    body:["Greengate Ranch sits in the hills above San Luis Obispo, and in late spring and summer the sun sets directly over the Santa Lucia range behind it. When the sky cooperates you get about 22 minutes of light that turns everything — the oaks, the dry grass, the guests' faces — into something very close to gold.", "I arrive an hour early and walk the property alone. Every venue has a handful of frames that only work if you already know where to stand when the light moves. At Greengate that means the split-rail fence along the east pasture, the shadow line on the barn's west wall around 6:40 PM, and the gap in the oak canopy at the bottom of the ceremony hill that creates a natural backlight channel.", "The technical challenge at Greengate is contrast management. The sky can be two and a half stops brighter than your subjects' faces. I expose for the faces, add fill with a Profoto B10 at about -1.7 EV, and let the sky do what it wants. The result looks natural but would not hold up without the fill.", "Plan your portraits for the 35 minutes before sunset. Do not wait for it — by the time the sun actually touches the ridgeline you have lost the warm, manageable light and gained a flat pink horizon that looks fine in the moment and forgettable in the gallery."]
  },
  {
    title:"The Central Coast light: what makes it different",
    date:"March 11, 2026", tag:"Craft",
    excerpt:"Photographers move to Los Angeles for the industry. They shoot in Big Sur for the drama. But the light between Paso Robles and Santa Barbara is something most people outside the region have never seen — and it changes everything.",
    body:["The marine layer is the story. Most mornings from May through July a thick coastal fog sits over the lowlands until 10 or 11 AM, then burns off quickly. The hour immediately after the burn-off — roughly 10:30 to noon depending on the season — produces what I consider the rarest light I have found anywhere: bright enough to shoot without artificial fill, soft enough to wrap around faces without harsh shadows, and with a color temperature that reads slightly warm-neutral on camera.", "For portraits this is transformative. Midday light is usually the enemy of flattering portraiture, but on the Central Coast it behaves like an enormous softbox for a 90-minute window that you can almost set your watch by. I schedule portrait sessions to hit that window whenever possible.", "The afternoons are different. Once the marine layer is gone, the light hardens and turns very directional. By 3 PM you are dealing with high-contrast, high-saturation California sun. It is beautiful for landscape and architectural work but difficult for faces. I use this window for fine art landscape scouting and leave the portraits to morning or golden hour.", "The vineyards above Paso Robles sit at 1,800 to 2,200 feet elevation and are completely free of marine influence. Up there, the light is more like what you would find in the Sierra foothills — bright, hard-edged, and consistent. For commercial wine work I generally prefer late afternoon when the low angle adds texture to the vines and the shadows are long enough to give depth to the rows."]
  },
  {
    title:"Gear I actually use: 2026 edition",
    date:"February 5, 2026", tag:"Gear",
    excerpt:"A no-nonsense look at what is in my bag for weddings, portraits, commercial shoots, and personal landscape work — and why each piece earned its spot.",
    body:["I do not change gear often. The cameras and lenses I use now are the result of a decade of working out what actually matters on a job — and what just looks impressive in a flatlay.", "Primary camera: Sony A7R V. Sixty-one megapixels sounds like more than you need until you are delivering a 40x50-inch fine art print or the client crops a wide frame tight for an unexpected album use. The dynamic range at base ISO is exceptional and the autofocus tracking is accurate enough that I rarely miss a moving subject.", "The lens I reach for first on every wedding and portrait job is the Sony 85mm f/1.4 GM. Nothing I have used resolves a background the way this lens does at f/1.6 to f/2.0. It is heavy and it is slow to walk around with, but when a frame matters, this is what makes it.", "For film I shoot a Hasselblad 500CM with a 80mm f/2.8 Planar. It is slow, requires a tripod or very deliberate handheld technique, and costs roughly two dollars per frame when you factor in processing. It is also the only camera I own that has ever made me stop mid-session and just look at the light rather than shoot it."]
  },
  {
    title:"How I approach the wedding day timeline",
    date:"January 14, 2026", tag:"Wedding",
    excerpt:"Most wedding timeline problems are photography problems in disguise. Here is how I work with couples to build a day that looks great in photos without feeling over-choreographed.",
    body:["The single most important line item in a wedding timeline is buffer. Most planners and photographers will tell you to build in 20 minutes of buffer. I recommend 40. The difference between a couple who ends their portraits relaxed and laughing and one who ends them stressed and rushed is almost always 20 minutes of buffer that disappeared somewhere between the ceremony ending late and the venue coordinator needing the dance floor cleared.", "I send every couple a one-page timeline guide six months before the wedding. It covers: how much time portraits actually take (45 minutes minimum, 75 if you want a variety of locations), when to schedule the first look relative to ceremony, how venue lighting conditions should affect your ceremony time, and how to build a reception timeline that does not cannibalise the best natural light of the evening.", "First looks are worth it. I know some couples feel strongly about not seeing each other before the ceremony and I completely respect that. But if it is open for discussion, I make the case every time: a first look gives you 25 minutes of private, unhurried portrait time with your best light, calms nerves before the ceremony rather than after, and means your cocktail hour portraits are covered before you are hungry and tired.", "The golden hour slot — typically 30 to 40 minutes before sunset — is non-negotiable on the timeline I propose. I ask for 20 minutes alone with the couple during cocktail hour to chase the light. Almost every couple who has done this with me has told me those frames are their favorites in the gallery."]

    body:["I used to use Shootproof. Before that, Smugmug. Before that, a self-hosted WordPress gallery that I would rather not discuss. I have been on Pixieset for three years and it is the first platform I have not felt the need to keep testing alternatives.", "The workflow starts in Capture One. I ingest directly from card to a mirrored RAID drive, apply a base correction layer that handles lens profiles and sensor corrections, then make a first cull to flag keepers. For a 10-hour wedding I am typically flagging 1,200 to 1,800 frames out of 3,000 to 4,000 captured.", "From there I apply global color grading — I have a handful of starting styles that I adapt per shoot depending on the light conditions and venue — then go frame by frame for local adjustments. Faces, highlight recovery, anything that needs individual attention. This is the slow part. A full wedding edit takes me about 14 hours across two or three days.", "I upload a private proofing gallery to Pixieset with password protection and share the link with the couple. They can favorite frames, leave comments, and download directly at full resolution. I include download stats in my project tracker — I find that couples who download within 48 hours of delivery are much more likely to leave reviews and refer friends than those who sit on the gallery for weeks."]

        <h1 style={{ fontFamily:t.hf, fontSize:52, fontStyle:'italic', fontWeight:400, color:t.fg, margin:'0 0 18px', lineHeight:1.05 }}>{post.title}</h1>
        <div style={{ fontFamily:t.bf, fontSize:12, color:t.fgMuted, marginBottom:48 }}>{post.date} · Jarod M. Berg</div>
        <Img label={`article image — ${post.tag.toLowerCase()}`} aspect="16/9" dark={dark} />
        <div style={{ marginTop:48 }}>
          <p style={{ fontFamily:t.bf, fontSize:16, color:t.fgMuted, lineHeight:1.9, marginBottom:28, fontStyle:'italic', borderLeft:`3px solid ${t.border}`, paddingLeft:20 }}>{post.excerpt}</p>
          {post.body.map((para,i) => (
            <p key={i} style={{ fontFamily:t.bf, fontSize:15, color:t.fgMuted, lineHeight:1.9, marginBottom:28 }}>{para}</p>
          ))}
        </div>
        <div style={{ marginTop:60, paddingTop:48, borderTop:`1px solid ${t.border}`, display:'flex', flexDirection:'column', gap:12, alignItems:'flex-start' }}>
          <div style={{ fontFamily:t.hf, fontSize:24, fontStyle:'italic', color:t.fg }}>Have a project in mind?</div>
          <Btn t={t} onClick={() => setPage('contact')}>Get in Touch</Btn>
        </div>
      </div>
    </div>
  );
};

// ── CLIENT GALLERIES ──────────────────────────────────────────────────────────
const GalleriesPage = ({ t }) => {
  const [code, setCode] = React.useState('');
  const [error, setError] = React.useState(false);
  return (
    <div style={{ paddingTop:64, background:t.bg, minHeight:'100vh' }}>
      <div style={{ padding:'80px 80px 100px', maxWidth:540, margin:'0 auto', textAlign:'center' }}>
        <SH label="Client Access" title="Your gallery." t={t} center />
        <p style={{ fontFamily:t.bf, fontSize:14, color:t.fgMuted, lineHeight:1.85, marginBottom:12 }}>Enter the access code from your delivery email to view and download your photos.</p>
        <p style={{ fontFamily:t.bf, fontSize:12, color:t.fgMuted, lineHeight:1.7, marginBottom:44 }}>Galleries are hosted on <strong>Pixieset</strong> and include full-resolution downloads, a favorites tool, and a built-in print shop.</p>
        <form onSubmit={e => { e.preventDefault(); if (!code.trim()) { setError(true); } else { setError(false); } }} style={{ display:'flex', flexDirection:'column', gap:14 }}>
          <input style={{ padding:'15px', fontFamily:t.bf, fontSize:13, background:t.bgAlt, border:`1px solid ${error ? 'oklch(55% 0.18 25)' : t.border}`, color:t.fg, textAlign:'center', letterSpacing:'0.2em', outline:'none' }} placeholder="ENTER ACCESS CODE" value={code} onChange={e => { setCode(e.target.value); setError(false); }} />
          {error && <div style={{ fontFamily:t.bf, fontSize:12, color:'oklch(55% 0.18 25)' }}>Please enter your access code to continue.</div>}
          <Btn t={t} type="submit" full>Access My Gallery</Btn>
        </form>
        <p style={{ fontFamily:t.bf, fontSize:12, color:t.fgMuted, lineHeight:1.7, marginTop:36 }}>Gallery not loading or no access code? Email <a href="mailto:hello@jarodberg.com" style={{ color:t.fg, textDecoration:'underline', textUnderlineOffset:3 }}>hello@jarodberg.com</a> and I will resend your delivery link.</p>
        <div style={{ marginTop:40, padding:'20px 28px', background:t.bgAlt, border:`1px solid ${t.border}` }}>
          <div style={{ fontFamily:t.bf, fontSize:11, color:t.fgMuted, lineHeight:1.7 }}>Galleries are available for <strong>12 months</strong> from delivery. If your gallery has expired and you need access to your images, reach out — I archive all client work for 3 years.</div>
        </div>
      </div>
    </div>
  );
};

// ── PRIVACY ───────────────────────────────────────────────────────────────────
const PrivacyPage = ({ t }) => (
  <div style={{ paddingTop:64, background:t.bg, minHeight:'100vh' }}>
    <div style={{ padding:'80px 80px 100px', maxWidth:720, margin:'0 auto' }}>
      <SH label="Legal" title="Privacy Policy" t={t} />
      <p style={{ fontFamily:t.bf, fontSize:12, color:t.fgMuted, marginBottom:32, lineHeight:1.7 }}>Last updated: April 2026</p>
      {[
        ["Information I collect", "When you submit the contact form, I collect your name, email address, phone number (optional), and the content of your message. This information is processed by Formspree and delivered to me by email. I do not store form submissions on this site."],
        ["How I use your information", "Solely to respond to your inquiry. I do not sell, rent, or share your information with third parties for marketing purposes. I may keep your contact details to follow up on an ongoing project."],
        ["Photography and likeness", "Images captured at contracted sessions are used in accordance with our signed agreement. By default, I may use photographs in my portfolio, website, and social media unless you request otherwise in writing before or at the time of booking."],
        ["Cookies and analytics", "This website does not use tracking cookies. If analytics are added in future (e.g. Plausible Analytics), this policy will be updated."],
        ["Contact", "For any privacy-related questions, email hello@jarodberg.com."],
      ].map(([heading, body]) => (
        <div key={heading} style={{ marginBottom:36, borderTop:`1px solid ${t.border}`, paddingTop:24 }}>
          <div style={{ fontFamily:t.hf, fontSize:22, fontStyle:'italic', color:t.fg, marginBottom:12 }}>{heading}</div>
          <p style={{ fontFamily:t.bf, fontSize:14, color:t.fgMuted, lineHeight:1.85 }}>{body}</p>
        </div>
      ))}
    </div>
  </div>
);

// ══════════════════════════ TWEAKS PANEL ══════════════════════════════════════
const TweaksPanel = ({ tweaks, setTweak, navigateTo }) => {
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    const h = (e) => {
      if (e.data?.type === '__activate_edit_mode') setVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setVisible(false);
    };
    window.addEventListener('message', h);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', h);
  }, []);
  const onClose = () => { setVisible(false); window.parent.postMessage({ type:'__edit_mode_dismissed' }, '*'); };
  const persist = (key, val) => { setTweak(key, val); window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ [key]:val } }, '*'); };
  if (!visible) return null;
  const t = THEMES[tweaks.theme] || THEMES['Bright Minimal'];
  const rBtn = (val, cur, fn) => (
    <button onClick={() => fn(val)} style={{ padding:'6px 12px', fontSize:10, letterSpacing:'0.12em', textTransform:'uppercase', background:cur===val?t.fg:'none', color:cur===val?t.bg:t.fgMuted, border:`1px solid ${cur===val?t.fg:t.border}`, cursor:'pointer', transition:'all 0.15s' }}>{val}</button>
  );
  return (
    <div style={{ position:'fixed', bottom:24, right:24, zIndex:9999, background:tweaks.theme==='Dark Cinematic'?'#1c1b1a':'#fff', border:`1px solid ${t.border}`, boxShadow:'0 8px 40px rgba(0,0,0,0.18)', padding:24, width:250, fontFamily:t.bf, color:t.fg }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20 }}>
        <span style={{ fontSize:11, fontWeight:600, letterSpacing:'0.14em', textTransform:'uppercase' }}>Tweaks</span>
        <button onClick={onClose} style={{ background:'none', border:'none', cursor:'pointer', color:t.fgMuted, fontSize:18, lineHeight:1, padding:0 }}>×</button>
      </div>
      <div style={{ fontSize:10, letterSpacing:'0.18em', textTransform:'uppercase', color:t.fgMuted, marginBottom:10 }}>Style</div>
      <div style={{ display:'flex', gap:4, flexWrap:'wrap', marginBottom:20 }}>
        {Object.keys(THEMES).map(n => rBtn(n, tweaks.theme, v => persist('theme', v)))}
      </div>
      <div style={{ fontSize:10, letterSpacing:'0.18em', textTransform:'uppercase', color:t.fgMuted, marginBottom:10 }}>Wordmark</div>
      <div style={{ display:'flex', gap:4, flexWrap:'wrap', marginBottom:20 }}>
        {['stacked','serif','mono'].map(v => rBtn(v, tweaks.wordmark, val => persist('wordmark', val)))}
      </div>
      <div style={{ fontSize:10, letterSpacing:'0.18em', textTransform:'uppercase', color:t.fgMuted, marginBottom:10 }}>Navigate to</div>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:4 }}>
        {[['home','Home'],['portfolio','Portfolio'],['about','About'],['services','Services'],['blog','Blog'],['contact','Contact'],['book','Book'],['client-galleries','Galleries']].map(([slug,label]) => (
          <button key={slug} onClick={() => navigateTo(slug)} style={{ background:'none', border:`1px solid ${t.border}`, cursor:'pointer', fontFamily:t.bf, fontSize:10, letterSpacing:'0.1em', textTransform:'uppercase', padding:'7px 4px', color:t.fgMuted, textAlign:'center' }}>{label}</button>
        ))}
      </div>
    </div>
  );
};

// ══════════════════════════ APP ═══════════════════════════════════════════════
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "Bright Minimal",
  "wordmark": "serif"
}/*EDITMODE-END*/;

const App = () => {
  const [tweaks, setTweaksState] = React.useState(() => {
    try { return { ...TWEAK_DEFAULTS, ...JSON.parse(localStorage.getItem('jb-tweaks') || '{}') }; }
    catch { return { ...TWEAK_DEFAULTS }; }
  });
  const setTweak = (key, val) => setTweaksState(prev => {
    const next = { ...prev, [key]:val };
    localStorage.setItem('jb-tweaks', JSON.stringify(next));
    return next;
  });

  const [page, setPage] = React.useState('home');
  const [activeBlog, setActiveBlog] = React.useState(null);
  const theme = tweaks.theme || 'Bright Minimal';
  const t = THEMES[theme];

  React.useEffect(() => {
    document.body.style.background = t.bg;
    window.scrollTo({ top:0 });
  }, [page, theme]);

  const navigateTo = (p) => { setActiveBlog(null); setPage(p); };

  const renderPage = () => {
    switch (page) {
      case 'home':             return <HomePage t={t} setPage={navigateTo} />;
      case 'portfolio':        return <PortfolioPage t={t} />;
      case 'about':            return <AboutPage t={t} setPage={navigateTo} />;
      case 'services':         return <ServicesPage t={t} setPage={navigateTo} />;
      case 'contact':          return <ContactPage t={t} />;
      case 'book':             return <BookPage t={t} />;
      case 'blog':             return <BlogPage t={t} onPost={p => { setActiveBlog(p); setPage('blog-post'); }} />;
      case 'blog-post':        return activeBlog ? <BlogPostPage t={t} post={activeBlog} setPage={navigateTo} /> : <BlogPage t={t} onPost={p => { setActiveBlog(p); setPage('blog-post'); }} />;
      case 'client-galleries': return <GalleriesPage t={t} />;
      case 'privacy':          return <PrivacyPage t={t} />;
      default:                 return <HomePage t={t} setPage={navigateTo} />;
    }
  };

  return (
    <div style={{ minHeight:'100vh', background:t.bg, display:'flex', flexDirection:'column' }}>
      <Nav t={t} page={page} setPage={navigateTo} wmark={tweaks.wordmark} />
      <main style={{ flex:1 }}>{renderPage()}</main>
      <Footer t={t} setPage={navigateTo} wmark={tweaks.wordmark} />
      <TweaksPanel tweaks={tweaks} setTweak={setTweak} navigateTo={navigateTo} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
